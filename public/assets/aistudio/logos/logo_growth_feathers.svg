<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="100%" height="100%">
  <rect width="700" height="500" fill="#FFFFFF"/>
  <defs>
    <linearGradient id="featherGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#4B5563"/>
      <stop offset="40%" stop-color="#9CA3AF"/>
      <stop offset="85%" stop-color="#E5E7EB"/>
      <stop offset="100%" stop-color="#F9FAFB"/>
    </linearGradient>
    <linearGradient id="quillGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="80%" stop-color="#4B5563"/>
      <stop offset="100%" stop-color="#D1D5DB"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <g transform="translate(350, 210)">
    <!-- Main Feather Silhouette -->
    <!-- Feather outer contour -->
    <path d="M -260, 20 C -220, -70 -120, -90 100, -70 C 180, -60 250, -20 280, 20 C 230, 85 100, 110 -100, 95 C -180, 85 -240, 60 -260, 20 Z" fill="url(#featherGrad)" filter="url(#softShadow)"/>

    <!-- Feather texture lines (fine vanes) -->
    <g stroke="#374151" stroke-width="0.8" opacity="0.4">
      <path d="M -240, 15 Q -180, -40 -120, -60"/>
      <path d="M -200, 20 Q -140, -40 -80, -65"/>
      <path d="M -160, 20 Q -100, -40 -40, -68"/>
      <path d="M -120, 22 Q -60, -40 0, -70"/>
      <path d="M -80, 22 Q -20, -40 40, -69"/>
      <path d="M -40, 24 Q 20, -35 80, -65"/>
      <path d="M 0, 25 Q 60, -30 120, -60"/>
      <path d="M 40, 25 Q 100, -25 160, -50"/>
      <path d="M 80, 24 Q 140, -15 200, -35"/>
      <path d="M 120, 22 Q 180, 0 240, -10"/>
      <!-- Lower vanes -->
      <path d="M -240, 25 Q -180, 60 -120, 75"/>
      <path d="M -200, 25 Q -140, 65 -80, 82"/>
      <path d="M -160, 26 Q -100, 70 -40, 88"/>
      <path d="M -120, 27 Q -60, 72 0, 90"/>
      <path d="M -80, 27 Q -20, 70 40, 88"/>
      <path d="M -40, 26 Q 20, 65 80, 82"/>
      <path d="M 0, 25 Q 60, 60 120, 75"/>
      <path d="M 40, 25 Q 100, 50 160, 60"/>
      <path d="M 80, 24 Q 140, 40 200, 45"/>
    </g>

    <!-- Center Quill Shaft / Spine -->
    <path d="M -270, 18 Q 0, 25 295, 20" stroke="url(#quillGrad)" stroke-width="4.5" stroke-linecap="round" fill="none"/>

    <!-- Central Branding on Feather -->
    <text x="-5" y="-10" font-family="'Plus Jakarta Sans', 'Times New Roman', serif" font-weight="900" font-size="34" fill="#111827" letter-spacing="3" text-anchor="middle">
      GROWTH
    </text>
    <text x="-5" y="24" font-family="'Plus Jakarta Sans', 'Times New Roman', serif" font-weight="800" font-size="32" fill="#FFFFFF" letter-spacing="4" text-anchor="middle" filter="drop-shadow(0px 1px 2px rgba(0,0,0,0.5))">
      FEATHERS
    </text>

    <!-- Hanging Chain Links -->
    <!-- Left Chain Link -->
    <g transform="translate(-115, 65)">
      <rect x="-4" y="0" width="8" height="14" rx="4" fill="none" stroke="#1F2937" stroke-width="2.5"/>
      <circle cx="0" cy="7" r="1.5" fill="#1F2937"/>
      <rect x="-4" y="10" width="8" height="14" rx="4" fill="none" stroke="#1F2937" stroke-width="2.5"/>
      <circle cx="0" cy="17" r="1.5" fill="#1F2937"/>
    </g>

    <!-- Right Chain Link -->
    <g transform="translate(105, 65)">
      <rect x="-4" y="0" width="8" height="14" rx="4" fill="none" stroke="#1F2937" stroke-width="2.5"/>
      <circle cx="0" cy="7" r="1.5" fill="#1F2937"/>
      <rect x="-4" y="10" width="8" height="14" rx="4" fill="none" stroke="#1F2937" stroke-width="2.5"/>
      <circle cx="0" cy="17" r="1.5" fill="#1F2937"/>
    </g>

    <!-- Hanging Slogan Text: GROW WITH US -->
    <text x="-5" y="115" font-family="'Plus Jakarta Sans', 'Georgia', serif" font-weight="900" font-size="28" fill="#111827" letter-spacing="3" text-anchor="middle">
      GROW WITH US
    </text>
  </g>
</svg>
