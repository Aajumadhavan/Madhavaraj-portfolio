<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <rect width="600" height="600" fill="#FFFFFF"/>
  <g transform="translate(300, 300)">
    <!-- Lime Green Circle Badge -->
    <circle cx="0" cy="0" r="190" fill="#69D73A"/>

    <!-- Mountain Peaks Silhouette in black -->
    <path d="M 40, -10 L 65, -35 L 75, -25 L 105, -55 L 135, -10" fill="none" stroke="#111827" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Charging Bull Graphic in Solid Black -->
    <g transform="translate(-40, -15)">
      <!-- Bull Body, Horns & Powerful Musculature -->
      <path d="M -65, 30 
               C -75, 20 -80, -5 -65, -25
               C -55, -40 -35, -55 -15, -60
               C -10, -55 -5, -45 -10, -35
               C -15, -25 -20, -15 -18, 0
               C -10, -15 10, -30 35, -35
               C 50, -38 65, -30 75, -15
               C 85, 0 80, 25 70, 45
               L 60, 40
               C 65, 30 68, 15 60, 5
               C 50, -8 35, -8 20, 5
               C 10, 15 5, 35 -5, 50
               L -20, 75 L -35, 75 L -30, 50
               C -40, 50 -50, 45 -65, 30 Z" fill="#111827"/>
      
      <!-- Bull Head & Sharp Horns -->
      <path d="M 25, -20 
               C 28, -35 40, -50 55, -55 
               C 52, -45 45, -35 38, -25 
               C 45, -28 55, -25 60, -15
               C 65, -5 60, 10 50, 15
               C 40, 18 30, 10 25, -5 Z" fill="#111827"/>
      <path d="M 45, -40 C 60, -55 75, -58 85, -45 C 75, -42 65, -40 55, -30 Z" fill="#111827"/>
      
      <!-- Forelegs Charging Forward -->
      <path d="M 45, 10 L 55, 45 L 42, 70 L 28, 70 L 35, 40 Z" fill="#111827"/>
      <path d="M 20, 15 L 25, 45 L 12, 70 L 0, 70 L 10, 35 Z" fill="#111827"/>
      
      <!-- Hind Legs -->
      <path d="M -50, 25 L -55, 50 L -68, 70 L -80, 70 L -68, 45 Z" fill="#111827"/>
      <path d="M -25, 30 L -30, 55 L -40, 75 L -50, 75 L -38, 45 Z" fill="#111827"/>
      
      <!-- Bull Tail Curved High -->
      <path d="M -60, -15 C -80, -25 -95, -15 -90, 0 C -85, 10 -75, 15 -70, 10 C -75, 5 -80, -2 -75, -8 C -70, -12 -65, -5 -60, -5 Z" fill="#111827"/>

      <!-- Ground Shadow Line -->
      <ellipse cx="-10" cy="74" rx="90" ry="3" fill="#111827"/>
    </g>

    <!-- Stacked Brand Text: YOUNG GREENS -->
    <g transform="translate(65, 15)">
      <!-- "YOUNG" in crisp black -->
      <text x="0" y="-5" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="28" fill="#111827" letter-spacing="1">
        YOUNG
      </text>
      <!-- "GREENS" in clean white -->
      <text x="0" y="24" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="30" fill="#FFFFFF" letter-spacing="2" filter="drop-shadow(0px 1px 1px rgba(0,0,0,0.3))">
        GREENS
      </text>
    </g>
  </g>
</svg>
